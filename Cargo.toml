[package]
name = "relay-ps5"
version = "0.1.19"
edition = "2021"
description = "使用 chiaki-ng 连接 PS5 的 Windows 播放器。"
license = "AGPL-3.0-only"
build = "build.rs"

[[bin]]
name = "RelayPlayer"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "=0.31.1"
serde_json = "1.0"
relay-protocol = { path = "vendor/relay-protocol" }
sha2 = "0.10"
winreg = "0.55"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"
raw-window-handle = "0.6"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_HiDpi", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
strip = "debuginfo"
[[test]]
name = "backend_protocol"
path = "src/backend_protocol_test.rs"
harness = false
